name: documentation

# see: https://coderefinery.github.io/documentation/gh_workflow/
# see: https://github.com/actions/setup-python
# see: https://github.com/marketplace/actions/setup-miniconda

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: 3.11
      - name: 创建虚拟环境
        run: |
          conda --version && git checkout sync-docs && conda create -n sphinx --file cn_docs/cn_enviroment.yml
      - name: 激活虚拟环境
        run: |
          conda activate sphinx
      - name: Sphinx 构建
        working-directory: ./
        run: |
          sphinx-build cn_docs/source build/cn/html
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/sync-docs' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/cn/html
          force_orphan: true
